# Quality gate : audit des dépendances, Biome, typage et build.
# Workflow réutilisable appelé par le déploiement. Le build validé (dist/) est exposé comme artefact neutre,
# indépendant de la cible de déploiement.
# Les actions tierces sont épinglées par SHA de commit (protection contre la réécriture de tags).
name: Quality gate

on:
  workflow_call:

permissions: {}

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Récupération du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installation de pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Installation de Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Installation des dépendances
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Audit des dépendances
        run: pnpm run audit

      - name: Biome
        run: pnpm run biome-check

      - name: Typage
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Publication du build validé
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1
